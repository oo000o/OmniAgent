services:
  nanobot-gateway:
    image: omniagent:local
    build:
      args:
        NODE_IMAGE: m.daocloud.io/docker.io/library/node:24-bookworm-slim
        UV_IMAGE: m.daocloud.io/ghcr.io/astral-sh/uv:python3.12-bookworm-slim
        NPM_REGISTRY: https://registry.npmmirror.com
        DEBIAN_MIRROR: https://mirrors.tuna.tsinghua.edu.cn
        PYPI_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    command: ["gateway"]
    env_file:
      - path: .env.omniagent
        required: true
    environment:
      NANOBOT_CONFIG_TEMPLATE: /app/config/omniagent.json
    volumes:
      - ./.docker-data:/home/nanobot/.nanobot
      - ./examples/omniagent.docker.config.json:/app/config/omniagent.json:ro
      - ./workspace:/data/workspace
      - ../data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18790/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
